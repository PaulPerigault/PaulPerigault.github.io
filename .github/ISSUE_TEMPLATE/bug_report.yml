name: Bug report
description: Signaler un dysfonctionnement du site
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Observer '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: "Navigateur, OS, mobile/desktop..."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Contexte additionnel
      description: Screenshots, logs console, etc.
    validations:
      required: false
