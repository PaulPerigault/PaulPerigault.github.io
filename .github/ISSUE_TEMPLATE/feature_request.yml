name: Feature request
description: Proposer une nouvelle fonctionnalité ou amélioration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
      description: Quel besoin ou quelle limite actuelle motive cette demande ?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Liste vérifiable (cases à cocher) de ce qui rend l'issue terminée.
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Plan de test (e2e Playwright, FR et EN si localisé)
      description: Quel test e2e couvrira la fonctionnalité ? (voir docs/test-matrix.md)
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Épic / issue parente
      placeholder: "#64"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Contexte additionnel
    validations:
      required: false
