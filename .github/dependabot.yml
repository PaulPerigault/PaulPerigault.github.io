version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Les paquets qui évoluent ensemble arrivent dans une seule PR (moins de bruit, versions alignées).
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      effect:
        patterns: ["effect", "@effect/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "prettier*"
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "@axe-core/*"
          - "@commitlint/*"
          - "husky"
          - "lint-staged"
          - "knip"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Worker du formulaire : dépendances propres (brique autonome).
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      worker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Fournisseur Terraform (Cloudflare) : jamais fusionné automatiquement (voir
  # dependabot-auto-merge.yml) ; relire le changelog, mettre à jour le lock, lancer un plan.
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    labels:
      - dependencies
      - infra

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    labels:
      - dependencies
    groups:
      actions:
        patterns: ["*"]

  # Images de base du Dockerfile (node, nginx-unprivileged).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    labels:
      - dependencies
    # Le stage de build doit rester sur la version de `.nvmrc` (LTS) : pas de saut de majeure automatique.
    ignore:
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
