name: Cross-browser

# Firefox et WebKit en plus de Chromium, une fois par semaine (ou à la demande).
on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      all-browsers: true
