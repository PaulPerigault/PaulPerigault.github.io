name: Cross-browser

# Contrôles hebdomadaires (ou à la demande) : Firefox et WebKit en plus de Chromium, liens sortants.
on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      all-browsers: true

  # Liens sortants (GitHub, sites tiers) : par le réseau, donc hebdomadaire plutôt qu'à chaque PR.
  links-external:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site
          path: dist
      - uses: ./.github/actions/setup-lychee
      - run: npm run check:links -- --external
