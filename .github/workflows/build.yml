name: Build

# Workflow réutilisable : le SEUL endroit où le site est construit. L'artefact `site` est ensuite
# testé (e2e, Lighthouse) puis déployé tel quel : ce qui est déployé est ce qui a été testé.
on:
  workflow_call:
    inputs:
      ref:
        description: "Référence Git à construire (par défaut : celle de l'événement)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Balises de vérification Search Console / Bing : variables du dépôt (vides = pas de balise).
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: dist
          retention-days: 7
          if-no-files-found: error
          # `dist/.well-known/security.txt` : les fichiers cachés sont exclus par défaut.
          include-hidden-files: true
