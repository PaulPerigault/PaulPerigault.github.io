name: CI

on:
  pull_request:
    branches: [main, develop, 'feat/**']
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run guard
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    uses: ./.github/workflows/build.yml

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml

  # Liens internes, ancres et URL du domaine dans l'artefact, hors ligne (lychee, docs/tooling.md).
  links:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - uses: ./.github/actions/setup-lychee
      # Aucun `npm ci` : le script n'utilise que Node et scripts/lib.
      - run: npm run check:links

  # Régression visuelle (#201, docs/visual-regression.md) : image Playwright épinglée par digest,
  # la même que `npm run test:visual:update` (scripts/lib/visual-image.mjs). Une référence absente
  # est écrite par Playwright et publiée en artefact `visual-snapshots`, à relire puis à commiter.
  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - run: npx playwright test e2e/visual.spec.ts
        env:
          VISUAL: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() }}
        with:
          name: visual-snapshots
          path: |
            e2e/__snapshots__/
            test-results/
          retention-days: 7

  # Une page par job (en parallèle) : le chemin critique ne dépend plus du nombre de pages.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { page: /fr/, name: fr }
          - { page: /en/, name: en }
          - { page: /fr/legal/, name: fr-legal }
          - { page: /en/legal/, name: en-legal }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - name: Lighthouse CI (budgets stricts, .lighthouserc.json)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          uploadArtifacts: true
          artifactName: lighthouse-${{ matrix.name }}
          temporaryPublicStorage: true
          configPath: .lighthouserc.json
        # Remplace la liste `collect.url` du fichier (variables LHCI_* prioritaires sur la config).
        env:
          LHCI_COLLECT__URL: ${{ matrix.page }}

  # Preview Cloudflare Pages de chaque PR (#207) : le MÊME artefact, envoyé sur la branche `pr-<n>`
  # du projet Pages, puis Lighthouse sur la preview (budgets de .lighthouserc.json). Sauté (vert)
  # sans le secret du token Pages, donc aussi pour les PR de fork et de Dependabot.
  pages-preview:
    if: github.event_name == 'pull_request'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Token Pages présent ?
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PAGES != '' }}
        run: |
          echo "ready=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != true ]; then
            echo "::notice::Preview Pages sautée : secret CLOUDFLARE_API_TOKEN_PAGES absent (issue #181)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Wrangler à la version exacte du lockfile du Worker (épinglé, vérifié par npm ci).
      - run: npm ci --prefix worker
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.gate.outputs.ready == 'true'
        with:
          name: site
          path: dist
      - name: Envoi de la preview
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: 5d7f707043c8dbe25d945c965f24880e
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --prefix worker wrangler pages deploy dist --project-name paulperigault --branch "pr-$PR_NUMBER"
          echo "url=https://pr-$PR_NUMBER.paulperigault.pages.dev" >> "$GITHUB_OUTPUT"
          echo "Preview : https://pr-$PR_NUMBER.paulperigault.pages.dev/fr/" >> "$GITHUB_STEP_SUMMARY"
        id: preview
      - name: Configuration Lighthouse de la preview
        if: steps.gate.outputs.ready == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node scripts/lighthouse-preview-config.mjs "$PREVIEW_URL" lighthouserc.preview.json
      - name: Lighthouse sur la preview (budgets stricts)
        if: steps.gate.outputs.ready == 'true'
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          uploadArtifacts: true
          artifactName: lighthouse-preview
          temporaryPublicStorage: true
          configPath: lighthouserc.preview.json

  # Worker du formulaire (brique autonome, ses propres dépendances) : lint, format, types, tests.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run verify

  # OpenTofu sans secret ni backend : format et validité. Jamais de plan ni d'apply en CI.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra init -backend=false -input=false
      - run: tofu -chdir=infra validate
      # Modules avec un provider simulé (infra/tests/*.tftest.hcl) : aucun appel à Cloudflare.
      - run: tofu -chdir=infra test
      # Brique identité (jetons limités) : mêmes contrôles, providers simulés.
      - run: tofu -chdir=infra/identity init -backend=false -input=false
      - run: tofu -chdir=infra/identity validate
      - run: tofu -chdir=infra/identity test
      # Brique registrar (délégation chez OVH) : module testé avec un provider simulé.
      - run: tofu -chdir=infra/registrar init -backend=false -input=false
      - run: tofu -chdir=infra/registrar validate
      - run: tofu -chdir=infra/registrar test
      # Brique github (réglages du dépôt) : ses blocs d'import excluent `tofu test` (comme infra/) ;
      # invariants vérifiés par scripts/infra-github-config.test.mjs.
      - run: tofu -chdir=infra/github init -backend=false -input=false
      - run: tofu -chdir=infra/github validate

  # Plan OpenTofu (#203) contre l'infrastructure réelle, avec un token Cloudflare et des clés R2 en
  # LECTURE SEULE (#181). Jamais d'apply ni de verrou. Sans ces secrets (avant leur création, PR de
  # fork), le job reste vert et le dit. Un écart (code 2) est signalé, sans casser la CI : seul le
  # propriétaire applique.
  tofu-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Secrets en lecture seule présents ?
        id: gate
        env:
          HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY != '' && secrets.TFSTATE_R2_READ_ACCESS_KEY_ID != '' && secrets.TFSTATE_R2_READ_SECRET_KEY != '' }}
          HAS_GITHUB: ${{ secrets.IAC_GITHUB_READONLY_TOKEN != '' }}
        run: |
          echo "ready=$HAS_SECRETS" >> "$GITHUB_OUTPUT"
          echo "github=$HAS_GITHUB" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SECRETS" != true ]; then
            echo "::notice::tofu plan sauté : secrets en lecture seule absents (création : issue #181)."
          fi
          if [ "$HAS_GITHUB" != true ]; then
            echo "::notice::plan de infra/github sauté : secret IAC_GITHUB_READONLY_TOKEN absent (issue #255)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.gate.outputs.ready == 'true'
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: tofu init et plan (lecture seule)
        if: steps.gate.outputs.ready == 'true'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_R2_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_R2_READ_SECRET_KEY }}
        run: |
          tofu -chdir=infra init -input=false -lockfile=readonly
          set +e
          tofu -chdir=infra plan -input=false -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          { echo '### tofu plan'; echo '```'; tail -n 200 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          verdict=$(grep -E '^(Plan: |No changes\.)' plan.txt | tail -n 1 || true)
          if [ -z "$verdict" ]; then
            echo "::error::Résumé du plan de infra/ introuvable (ni « Plan: » ni « No changes ») : sortie lue en entier ?"
            exit 1
          fi
          echo "Résultat du plan de infra/ : $verdict"
          if [ "$code" = 2 ]; then
            echo "::notice::Écart entre infra/ et l'infrastructure réelle : relire le plan (résumé du job)."
            exit 0
          fi
          exit "$code"
      # Réglages du dépôt (#255) : jeton fine-grained en lecture seule, même clé R2 du state.
      - name: tofu init et plan de infra/github (lecture seule)
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.github == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.IAC_GITHUB_READONLY_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_R2_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_R2_READ_SECRET_KEY }}
        run: |
          tofu -chdir=infra/github init -input=false -lockfile=readonly
          set +e
          tofu -chdir=infra/github plan -input=false -lock=false -no-color -detailed-exitcode > github-plan.txt 2>&1
          code=$?
          set -e
          { echo '### tofu plan (github)'; echo '```'; tail -n 200 github-plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          verdict=$(grep -E '^(Plan: |No changes\.)' github-plan.txt | tail -n 1 || true)
          if [ -z "$verdict" ]; then
            echo "::error::Résumé du plan de infra/github introuvable (ni « Plan: » ni « No changes ») : sortie lue en entier ?"
            exit 1
          fi
          echo "Résultat du plan de infra/github : $verdict"
          if [ "$code" = 2 ]; then
            echo "::notice::Écart entre infra/github et le dépôt réel : relire le plan (résumé du job)."
            # Brique sans secret : les lignes de changement vont aussi dans le journal.
            grep -E '^ *# |^ *[~+-] |^Plan:' github-plan.txt || true
            exit 0
          fi
          exit "$code"

  # Audit statique des workflows et actions (injections, permissions, épinglage, Dependabot).
  # Version de zizmor figée (la plus récente connue de l'action v0.6.4) : un nouvel audit arrive
  # par une PR, jamais par surprise.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          min-severity: medium
          advanced-security: false
          annotations: true

  # Point de contrôle unique (check requis `ci`) : vert seulement si TOUT le reste est vert.
  ci:
    if: ${{ always() }}
    needs: [verify, build, e2e, links, lighthouse, visual, pages-preview, worker, infra, tofu-plan, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Échouer si un job requis a échoué ou a été annulé
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "Tous les jobs sont verts."
