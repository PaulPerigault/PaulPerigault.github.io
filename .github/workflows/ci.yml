name: CI

on:
  pull_request:
    branches: [main, develop, 'feat/**']
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run guard
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    uses: ./.github/workflows/build.yml

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml

  # Liens internes, ancres et URL du domaine dans l'artefact, hors ligne (lychee, docs/tooling.md).
  links:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - uses: ./.github/actions/setup-lychee
      # Aucun `npm ci` : le script n'utilise que Node et scripts/lib.
      - run: npm run check:links

  # Régression visuelle (#201, docs/visual-regression.md) : image Playwright épinglée par digest,
  # la même que `npm run test:visual:update` (scripts/lib/visual-image.mjs). Une référence absente
  # est écrite par Playwright et publiée en artefact `visual-snapshots`, à relire puis à commiter.
  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - run: npx playwright test e2e/visual.spec.ts
        env:
          VISUAL: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() }}
        with:
          name: visual-snapshots
          path: |
            e2e/__snapshots__/
            test-results/
          retention-days: 7

  # Une page par job (en parallèle) : le chemin critique ne dépend plus du nombre de pages.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { page: /fr/, name: fr }
          - { page: /en/, name: en }
          - { page: /fr/legal/, name: fr-legal }
          - { page: /en/legal/, name: en-legal }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - name: Lighthouse CI (budgets stricts, .lighthouserc.json)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          uploadArtifacts: true
          artifactName: lighthouse-${{ matrix.name }}
          temporaryPublicStorage: true
          configPath: .lighthouserc.json
        # Remplace la liste `collect.url` du fichier (variables LHCI_* prioritaires sur la config).
        env:
          LHCI_COLLECT__URL: ${{ matrix.page }}

  # Worker du formulaire (brique autonome, ses propres dépendances) : lint, format, types, tests.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run verify

  # OpenTofu sans secret ni backend : format et validité. Jamais de plan ni d'apply en CI.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra init -backend=false -input=false
      - run: tofu -chdir=infra validate
      # Modules avec un provider simulé (infra/tests/*.tftest.hcl) : aucun appel à Cloudflare.
      - run: tofu -chdir=infra test

  # Audit statique des workflows et actions (injections, permissions, épinglage, Dependabot).
  # Version de zizmor figée (la plus récente connue de l'action v0.6.4) : un nouvel audit arrive
  # par une PR, jamais par surprise.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          min-severity: medium
          advanced-security: false
          annotations: true

  # Point de contrôle unique (check requis `ci`) : vert seulement si TOUT le reste est vert.
  ci:
    if: ${{ always() }}
    needs: [verify, build, e2e, links, lighthouse, visual, worker, infra, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Échouer si un job requis a échoué ou a été annulé
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "Tous les jobs sont verts."
