name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Auteur de la PR et dépôt d'origine, pas l'acteur (celui qui a déclenché l'événement,
  # usurpable : zizmor bot-conditions). fetch-metadata revérifie l'auteur et le 1er commit signé.
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      # Jamais pour Terraform : une mise à jour du fournisseur peut changer le plan de l'infra réelle.
      - name: Approve and enable auto-merge for patch/minor updates
        if: |
          steps.metadata.outputs.package-ecosystem != 'terraform' && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
