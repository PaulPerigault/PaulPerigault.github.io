name: Deploy

# Déploiement de `main` sur Cloudflare Pages (ADR-0008) : build unique → e2e sur l'artefact →
# provenance → publication du MÊME artefact → IndexNow. Le déclencheur planifié reconstruit chaque
# semaine (données GitHub, lastmod, security.txt) sans commit.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: main

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      ref: main

  # Production sur Cloudflare Pages (#207, #208) : branche de production `main` du projet. Le
  # secret est obligatoire depuis la bascule : son absence fait échouer le déploiement.
  pages:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix worker
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      # Provenance SLSA de l'artefact testé puis déployé (#202), signée par l'identité OIDC du run :
      # `gh attestation verify <fichier> --repo PaulPerigault/PaulPerigault.github.io`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**'
      - name: Envoi en production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: 5d7f707043c8dbe25d945c965f24880e
        run: npx --prefix worker wrangler pages deploy dist --project-name paulperigault --branch main
      - name: Notifier IndexNow (Bing, Yandex…)
        continue-on-error: true
        run: node scripts/indexnow.mjs
