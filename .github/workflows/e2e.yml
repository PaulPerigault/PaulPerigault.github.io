name: E2E

# Workflow réutilisable : tests Playwright sur l'artefact `site` (jamais un nouveau build).
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      all-browsers:
        description: "Ajouter Firefox et WebKit (exécution planifiée)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PW_ALL_BROWSERS: ${{ inputs.all-browsers && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - name: Charge utile IndexNow (simulation)
        run: node scripts/indexnow.mjs --dry-run
      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps ${{ inputs.all-browsers && 'chromium firefox webkit' || 'chromium' }}
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ inputs.all-browsers && 'all-browsers' || 'chromium' }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
