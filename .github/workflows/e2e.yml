name: E2E

# Workflow réutilisable : tests Playwright sur l'artefact `site` (jamais un nouveau build).
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      all-browsers:
        description: "Ajouter Firefox et WebKit (exécution planifiée)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deux machines se partagent les tests (`--shard`) : Playwright domine le chemin critique de la
    # CI (build → e2e) ; mesures dans docs/perf-report.md.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PW_ALL_BROWSERS: ${{ inputs.all-browsers && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - name: Charge utile IndexNow (simulation)
        run: node scripts/indexnow.mjs --dry-run
      # Navigateurs en cache, clé = version exacte de Playwright : seul le premier run d'une version
      # les télécharge. Chromium n'a pas besoin de dépendances système (apt) sur ubuntu-latest ;
      # Firefox et WebKit (workflow hebdomadaire) les installent.
      - name: Version de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache des navigateurs Playwright
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.all-browsers && 'all' || 'chromium' }}
      - name: Installer les navigateurs Playwright
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install ${{ inputs.all-browsers && 'chromium firefox webkit' || 'chromium' }}
      - name: Dépendances système de Firefox et WebKit
        if: ${{ inputs.all-browsers }}
        run: npx playwright install-deps firefox webkit
      - run: npm run e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ inputs.all-browsers && 'all-browsers' || 'chromium' }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
