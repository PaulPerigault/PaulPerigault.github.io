name: E2E

# Workflow réutilisable : tests Playwright sur l'artefact `site` (jamais un nouveau build).
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      all-browsers:
        description: "Ajouter Firefox et WebKit (exécution planifiée)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PW_ALL_BROWSERS: ${{ inputs.all-browsers && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site
          path: dist
      - name: Charge utile IndexNow (simulation)
        run: node scripts/indexnow.mjs --dry-run
      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps ${{ inputs.all-browsers && 'chromium firefox webkit' || 'chromium' }}
      - run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ inputs.all-browsers && 'all-browsers' || 'chromium' }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
