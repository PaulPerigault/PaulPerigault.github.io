name: Gitleaks watch

# gitleaks est épinglé à la main dans security.yml (version + SHA-256) : Dependabot ne le voit pas.
# Chaque semaine, une issue est ouverte (une seule) si une version plus récente est sortie, avec le
# SHA-256 à recopier (#204). Lecture de l'API publique, écriture d'issues seulement.
on:
  schedule:
    - cron: '37 7 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # Aucun `npm ci` : le script n'utilise que Node et scripts/lib.
      - run: node scripts/gitleaks-watch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
