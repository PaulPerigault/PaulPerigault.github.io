name: Live

# Contrôle du site réellement en production (#208) : redirections, HTTPS, 8 en-têtes de sécurité de
# public/_headers (valeurs exactes), robots, robots d'IA non bloqués, security.txt, vrai 404.
# Chaque semaine après le redéploiement planifié, et à la demande. Lecture seule.
on:
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # Aucun `npm ci` : le contrôle n'utilise que Node, scripts/lib et public/_headers.
      - run: npm run check:live
