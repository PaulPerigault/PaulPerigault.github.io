name: Release

on:
  push:
    branches: [main]

# release-please agit avec son propre jeton (`secrets.TOKEN`) : GITHUB_TOKEN n'a besoin d'aucun droit.
permissions: {}

# Jamais annulé en cours : release-please pourrait laisser un tag sans release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          release-type: node
          target-branch: main
          token: ${{ secrets.TOKEN }}
