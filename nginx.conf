# Serveur statique du site (image Docker). GitHub Pages n'envoie pas d'en-têtes : ceux-ci ne
# s'appliquent qu'à ce déploiement. Les hashes de script/style ne sont PAS ici : ils changent à chaque
# build et sont déjà dans la balise <meta http-equiv="content-security-policy"> de chaque page ;
# les navigateurs cumulent les deux politiques. Ce fichier ajoute ce que la balise ne peut pas dire.
types {
    text/markdown md;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;

    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS : n'a d'effet que servi en HTTPS (proxy TLS devant le conteneur).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # `expires` (et non `add_header`) : un add_header dans un location remplacerait tous les
    # en-têtes de sécurité déclarés au niveau du serveur.
    location / {
        try_files $uri $uri/ =404;
        expires epoch;
    }

    # Fichiers à empreinte : cache d'un an.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
    }
}
