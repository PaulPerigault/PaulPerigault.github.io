<section class="py-20 px-4 bg-white dark:bg-gray-950">
  <div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-10">{{ 'certifications.title' | translate }}</h2>
    <div class="space-y-3">
      @for (item of items(); track item.id) {
      <div
        class="border border-gray-200 dark:border-gray-800 rounded-xl p-4 flex items-center justify-between hover:border-teal-500 transition-colors"
        [class.opacity-60]="item.inProgress"
      >
        <div>
          <h3 class="font-medium text-gray-900 dark:text-white text-sm">{{ item.name }}</h3>
          <p class="text-xs text-teal-600 mt-0.5">{{ item.issuer }}</p>
        </div>
        <div class="text-right flex-shrink-0 ml-4">
          @if (item.inProgress) {
          <span class="text-xs font-mono text-amber-500">{{ 'certifications.in_progress' | translate }}</span>
          } @else {
          <span class="text-xs font-mono text-gray-400">{{ formatDate(item.dateIssued!) }}</span>
          }
        </div>
      </div>
      }
    </div>
  </div>
</section>
