<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[60] focus:px-4 focus:py-2 focus:bg-teal-700 focus:text-white focus:text-sm focus:font-medium focus:rounded-lg"
>
  {{ 'nav.skip_to_content' | translate }}
</a>
<nav
  class="fixed top-0 left-0 right-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-b border-gray-200 dark:border-gray-800"
>
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
    <button
      (click)="scrollTo('hero')"
      class="font-mono text-sm font-semibold text-gray-900 dark:text-white tracking-tight"
    >
      paul<span class="text-teal-600 dark:text-teal-400">&#64;</span>perigault
    </button>
    <ul class="hidden md:flex items-center gap-4 text-sm text-gray-600 dark:text-gray-400">
      <li>
        <button
          (click)="scrollTo('about')"
          class="min-h-11 px-2 flex items-center hover:text-teal-600 transition-colors"
        >
          {{ 'nav.about' | translate }}
        </button>
      </li>
      <li>
        <button
          (click)="scrollTo('skills')"
          class="min-h-11 px-2 flex items-center hover:text-teal-600 transition-colors"
        >
          {{ 'nav.skills' | translate }}
        </button>
      </li>
      <li>
        <button
          (click)="scrollTo('experience')"
          class="min-h-11 px-2 flex items-center hover:text-teal-600 transition-colors"
        >
          {{ 'nav.experience' | translate }}
        </button>
      </li>
      <li>
        <button
          (click)="scrollTo('formation')"
          class="min-h-11 px-2 flex items-center hover:text-teal-600 transition-colors"
        >
          {{ 'nav.formation' | translate }}
        </button>
      </li>
      <li>
        <button
          (click)="scrollTo('projects')"
          class="min-h-11 px-2 flex items-center hover:text-teal-600 transition-colors"
        >
          {{ 'nav.projects' | translate }}
        </button>
      </li>
      <li>
        <button
          (click)="scrollTo('certifications')"
          class="min-h-11 px-2 flex items-center hover:text-teal-600 transition-colors"
        >
          {{ 'nav.certifications' | translate }}
        </button>
      </li>
      <li>
        <button
          (click)="scrollTo('contact')"
          class="min-h-11 px-2 flex items-center hover:text-teal-600 transition-colors"
        >
          {{ 'nav.contact' | translate }}
        </button>
      </li>
    </ul>
    <div class="flex items-center gap-2">
      <button
        (click)="switchLang()"
        [attr.aria-label]="currentLang === 'fr' ? 'Switch to English' : 'Passer en français'"
        class="min-w-11 min-h-11 flex items-center justify-center text-xs font-mono px-2 rounded border border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:border-teal-500 transition-colors"
      >
        {{ currentLang === 'fr' ? 'EN' : 'FR' }}
      </button>
      <button
        (click)="theme.toggle()"
        [attr.aria-label]="(theme.theme() === 'dark' ? 'theme.toggle_to_light' : 'theme.toggle_to_dark') | translate"
        class="w-11 h-11 flex items-center justify-center rounded border border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:border-teal-500 transition-colors text-sm"
      >
        <span aria-hidden="true">{{ theme.theme() === 'dark' ? '☀' : '☾' }}</span>
      </button>
      <button
        #menuButton
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="pp-mobile-menu"
        [attr.aria-label]="(menuOpen() ? 'nav.menu_close' : 'nav.menu_open') | translate"
        class="md:hidden w-11 h-11 flex items-center justify-center text-gray-600 dark:text-gray-400 text-lg"
      >
        <span aria-hidden="true">{{ menuOpen() ? '&#10005;' : '&#9776;' }}</span>
      </button>
    </div>
  </div>
  @if (menuOpen()) {
  <div
    #menuPanel
    id="pp-mobile-menu"
    (keydown)="onMenuKeydown($event)"
    class="md:hidden border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-4 py-2 flex flex-col text-sm text-gray-600 dark:text-gray-400"
  >
    <button (click)="scrollTo('about')" class="min-h-11 flex items-center text-left hover:text-teal-600">
      {{ 'nav.about' | translate }}
    </button>
    <button (click)="scrollTo('skills')" class="min-h-11 flex items-center text-left hover:text-teal-600">
      {{ 'nav.skills' | translate }}
    </button>
    <button (click)="scrollTo('experience')" class="min-h-11 flex items-center text-left hover:text-teal-600">
      {{ 'nav.experience' | translate }}
    </button>
    <button (click)="scrollTo('formation')" class="min-h-11 flex items-center text-left hover:text-teal-600">
      {{ 'nav.formation' | translate }}
    </button>
    <button (click)="scrollTo('projects')" class="min-h-11 flex items-center text-left hover:text-teal-600">
      {{ 'nav.projects' | translate }}
    </button>
    <button (click)="scrollTo('certifications')" class="min-h-11 flex items-center text-left hover:text-teal-600">
      {{ 'nav.certifications' | translate }}
    </button>
    <button (click)="scrollTo('contact')" class="min-h-11 flex items-center text-left hover:text-teal-600">
      {{ 'nav.contact' | translate }}
    </button>
  </div>
  }
</nav>
